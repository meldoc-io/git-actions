name: Release Actions

on:
  push:
    branches:
      - main
  workflow_dispatch:
    inputs:
      action_name:
        description: 'Specific action to release (leave empty to auto-detect)'
        required: false
        type: string
      version_bump:
        description: 'Version bump type (major, minor, patch)'
        required: false
        type: choice
        options:
          - major
          - minor
          - patch
        default: patch

permissions:
  contents: write
  pull-requests: read

jobs:
  detect-changes:
    runs-on: ubuntu-latest
    outputs:
      changed_actions: ${{ steps.filter.outputs.changed_actions }}
      changed_actions_json: ${{ steps.filter.outputs.changed_actions_json }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Detect changed actions
        id: filter
        run: |
          if [ "${{ github.event_name }}" == "workflow_dispatch" ] && [ -n "${{ github.event.inputs.action_name }}" ]; then
            # Manual trigger with specific action
            ACTION_NAME="${{ github.event.inputs.action_name }}"
            if [ -d "actions/$ACTION_NAME" ] && [ -f "actions/$ACTION_NAME/action.yml" ]; then
              echo "changed_actions=$ACTION_NAME" >> $GITHUB_OUTPUT
              echo "changed_actions_json=[\"$ACTION_NAME\"]" >> $GITHUB_OUTPUT
            else
              echo "Action '$ACTION_NAME' not found in actions/ directory or missing action.yml"
              exit 1
            fi
          else
            # Auto-detect changed actions
            if [ "${{ github.event_name }}" == "push" ]; then
              BASE_SHA="${{ github.event.before }}"
              HEAD_SHA="${{ github.sha }}"
            else
              BASE_SHA="HEAD~1"
              HEAD_SHA="HEAD"
            fi
            
            # Get list of changed files
            CHANGED_FILES=$(git diff --name-only $BASE_SHA $HEAD_SHA)
            
            # Extract unique action directories from changed files
            # Filter out .gitkeep and only include directories that have action.yml
            CHANGED_ACTIONS=""
            for FILE in $(echo "$CHANGED_FILES" | grep "^actions/" | cut -d'/' -f2 | sort -u); do
              # Skip .gitkeep and other non-directory entries
              if [ "$FILE" != ".gitkeep" ] && [ -d "actions/$FILE" ] && [ -f "actions/$FILE/action.yml" ]; then
                if [ -z "$CHANGED_ACTIONS" ]; then
                  CHANGED_ACTIONS="$FILE"
                else
                  CHANGED_ACTIONS="$CHANGED_ACTIONS,$FILE"
                fi
              fi
            done
            
            if [ -z "$CHANGED_ACTIONS" ]; then
              echo "No changes detected in actions/ directory"
              echo "changed_actions=" >> $GITHUB_OUTPUT
              echo "changed_actions_json=[]" >> $GITHUB_OUTPUT
            else
              echo "Changed actions: $CHANGED_ACTIONS"
              echo "changed_actions=$CHANGED_ACTIONS" >> $GITHUB_OUTPUT
              # Create JSON array for matrix using Python for reliability
              JSON_ARRAY=$(python3 -c "import sys; actions = [a.strip() for a in sys.stdin.read().split(',') if a.strip()]; print('[' + ','.join('\"' + a + '\"' for a in actions) + ']')" <<< "$CHANGED_ACTIONS")
              echo "changed_actions_json=$JSON_ARRAY" >> $GITHUB_OUTPUT
            fi
          fi

  release:
    needs: detect-changes
    if: needs.detect-changes.outputs.changed_actions != ''
    runs-on: ubuntu-latest
    strategy:
      matrix:
        action: ${{ fromJson(needs.detect-changes.outputs.changed_actions_json) }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Setup Git
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

      - name: Get action metadata
        id: action_meta
        working-directory: actions/${{ matrix.action }}
        run: |
          if [ -f "action.yml" ]; then
            # Extract name and description from action.yml
            NAME=$(grep -E '^name:' action.yml | head -1 | sed 's/name:[[:space:]]*//' | tr -d '"' || echo "${{ matrix.action }}")
            DESC=$(grep -E '^description:' action.yml | head -1 | sed 's/description:[[:space:]]*//' | tr -d '"' || echo "GitHub Action: ${{ matrix.action }}")
            echo "name=$NAME" >> $GITHUB_OUTPUT
            echo "description=$DESC" >> $GITHUB_OUTPUT
          else
            echo "name=${{ matrix.action }}" >> $GITHUB_OUTPUT
            echo "description=GitHub Action: ${{ matrix.action }}" >> $GITHUB_OUTPUT
          fi

      - name: Determine version
        id: version
        run: |
          ACTION_NAME="${{ matrix.action }}"

          # Get the latest tag for this action
          LATEST_TAG=$(git tag -l "${ACTION_NAME}/v*" | sort -V | tail -1 || echo "")

          if [ -z "$LATEST_TAG" ]; then
            # No previous version, start at 1.0.0
            NEW_VERSION="1.0.0"
            echo "No previous version found, starting at v1.0.0"
          else
            # Extract version number from tag (format: action-name/v1.2.3)
            CURRENT_VERSION=$(echo "$LATEST_TAG" | sed "s|${ACTION_NAME}/v||")
            
            # Determine bump type
            if [ "${{ github.event_name }}" == "workflow_dispatch" ] && [ -n "${{ github.event.inputs.version_bump }}" ]; then
              BUMP_TYPE="${{ github.event.inputs.version_bump }}"
            else
              # Auto-detect from commit messages (conventional commits)
              COMMITS=$(git log --pretty=format:"%s" ${LATEST_TAG}..HEAD -- "actions/${ACTION_NAME}/")
              
              if echo "$COMMITS" | grep -qE "^(feat|feature)(\(.+\))?:"; then
                BUMP_TYPE="minor"
              elif echo "$COMMITS" | grep -qE "^(fix|bugfix)(\(.+\))?:"; then
                BUMP_TYPE="patch"
              elif echo "$COMMITS" | grep -qE "^(break|breaking)(\(.+\))?:" || echo "$COMMITS" | grep -qE "!:"; then
                BUMP_TYPE="major"
              else
                BUMP_TYPE="patch"
              fi
            fi
            
            # Bump version
            IFS='.' read -r MAJOR MINOR PATCH <<< "$CURRENT_VERSION"
            
            case "$BUMP_TYPE" in
              major)
                MAJOR=$((MAJOR + 1))
                MINOR=0
                PATCH=0
                ;;
              minor)
                MINOR=$((MINOR + 1))
                PATCH=0
                ;;
              patch)
                PATCH=$((PATCH + 1))
                ;;
            esac
            
            NEW_VERSION="${MAJOR}.${MINOR}.${PATCH}"
            echo "Bumping version from $CURRENT_VERSION to $NEW_VERSION ($BUMP_TYPE)"
          fi

          TAG_NAME="${ACTION_NAME}/v${NEW_VERSION}"
          echo "version=$NEW_VERSION" >> $GITHUB_OUTPUT
          echo "tag=$TAG_NAME" >> $GITHUB_OUTPUT

      - name: Generate release notes
        id: release_notes
        run: |
          ACTION_NAME="${{ matrix.action }}"
          TAG_NAME="${{ steps.version.outputs.tag }}"

          # Get commits since last tag
          LATEST_TAG=$(git tag -l "${ACTION_NAME}/v*" | sort -V | tail -1 || echo "")

          if [ -z "$LATEST_TAG" ]; then
            COMMITS=$(git log --pretty=format:"- %s (%h)" -- "actions/${ACTION_NAME}/")
          else
            COMMITS=$(git log --pretty=format:"- %s (%h)" ${LATEST_TAG}..HEAD -- "actions/${ACTION_NAME}/")
          fi

          if [ -z "$COMMITS" ]; then
            COMMITS="- Initial release"
          fi

          # Generate release notes
          {
            echo "## Changes"
            echo ""
            echo "$COMMITS"
            echo ""
            echo "## Usage"
            echo ""
            echo '```yaml'
            echo "- uses: meldoc-io/git-actions/actions/${ACTION_NAME}@${TAG_NAME}"
            echo '```'
          } > release_notes.txt

          # Output for GitHub Actions (multiline)
          {
            echo "body<<EOF"
            cat release_notes.txt
            echo "EOF"
          } >> $GITHUB_OUTPUT

      - name: Create tag
        run: |
          ACTION_NAME="${{ matrix.action }}"
          TAG_NAME="${{ steps.version.outputs.tag }}"
          git tag -a "$TAG_NAME" -m "Release ${{ steps.action_meta.outputs.name }} v${{ steps.version.outputs.version }}"
          git push origin "$TAG_NAME"

          # Create/update major version alias tag (e.g., cc-pr-review/v1 for v1.x.x)
          IFS='.' read -r MAJOR MINOR PATCH <<< "${{ steps.version.outputs.version }}"
          MAJOR_TAG="${ACTION_NAME}/v${MAJOR}"

          # Delete existing major tag if it exists (locally and remotely)
          git tag -d "$MAJOR_TAG" 2>/dev/null || true
          git push origin ":refs/tags/$MAJOR_TAG" 2>/dev/null || true

          # Create new major tag pointing to the same commit
          git tag -a "$MAJOR_TAG" -m "Major version alias for ${{ steps.action_meta.outputs.name }} v${MAJOR}.x.x (points to v${{ steps.version.outputs.version }})"
          git push origin "$MAJOR_TAG"

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v1
        with:
          tag_name: ${{ steps.version.outputs.tag }}
          name: ${{ steps.action_meta.outputs.name }} v${{ steps.version.outputs.version }}
          body: ${{ steps.release_notes.outputs.body }}
          draft: false
          prerelease: false
